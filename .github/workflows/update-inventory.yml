name: Fahrzeugbestand automatisch aktualisieren

on:
  schedule:
    # Läuft alle 6 Stunden automatisch
    - cron: '0 */6 * * *'
  workflow_dispatch: # Ermöglicht auch manuelles Auslösen per Klick auf GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Skript ausführen & HTML aktualisieren
        run: python update_inventory.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fahrzeugbestand automatisch aktualisiert" && git push)
