name: Fahrzeugbestand automatisch aktualisieren

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Abhängigkeiten & Playwright installieren
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests playwright
          playwright install chromium
          playwright install-deps

      - name: Skript ausführen & HTML aktualisieren
        run: python update_inventory.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html img/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fahrzeugbestand automatisch aktualisiert" && git push)
